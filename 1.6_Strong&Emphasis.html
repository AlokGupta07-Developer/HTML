<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some others tag</title>
</head>
<body>
    <!-- Use <strong> for importance -->
<p><strong>Deadline: Friday</strong> — do not miss it.</p>

<!-- Use <b> for visual bold only (like a keyword) -->
<p>The tag is called <b>strong</b>.</p>

<!-- Use <em> for spoken stress -->
<p>You must <em>practice</em> every day.</p>

<!-- Use <i> for titles, foreign words, technical terms -->
<p>The book <i>Harry Potter</i> is amazing.</p>

<p>A paragraph with automatic spacing.</p>

<p>Line one.<br>Line two in same paragraph.</p>

<blockquote>
  "Learning HTML is fun!"
</blockquote>
</body>
</html>
