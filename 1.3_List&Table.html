<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list_table</title>
  </head>
  <body>
    <ol>
      <li>Apple</li>
      <li>Banana</li>
      <li>Papaya</li>
      <li>Graps</li>
    </ol>
    <ul>
      <li>Apple</li>
      <li>Banana</li>
      <li>Papaya</li>
      <li>Graps</li>
    </ul>

    <dl>
      <dt>HTML</dt>
      <dd>Hyper Text Markup Language</dd>
    </dl>
    <hr />
    <br />
    <table border="3">
      <caption>
        Stationary
      </caption>
      <th>Items</th>
      <th>Quantity</th>
      <th>Price</th>
      <tr>
        <td>Pencil</td>
        <td>2</td>
        <td>10</td>
      </tr>
      <tr>
        <td>Eraser</td>
        <td>2</td>
        <td>10</td>
      </tr>
      <tr>
        <td>Scale</td>
        <td>2</td>
        <td>14</td>
      </tr>

      <tr>
        <td>Box</td>
        <td>2</td>
        <td>20</td>
      </tr>
      <tr>
        <td>Total</td>
        <td>8</td>
        <td>54</td>
      </tr>
    </table>

    <br />
    <hr />
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">Riya</td>
          <td>21</td>
          <td>Delhi</td>
        </tr>
        <tr>
          <td colspan="3">Arjun</td>
          <td>24</td>
          <td>Mumbai</td>
        </tr>
        <!-- colspan: merge across columns -->
      </tbody>
    </table>

    <hr />
    <br /><br />
  </body>
</html>
